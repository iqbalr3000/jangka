name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jangka
          POSTGRES_PASSWORD: jangka
          POSTGRES_DB: jangka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jangka -d jangka_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://jangka:jangka@localhost:5432/jangka_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Before the unit/integration tests: the worker's tests render diagrams and PDFs in Chromium.
      - run: pnpm --filter @jangka/e2e exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm test:e2e

  docker:
    # The image builds (Dockerfile changes are otherwise untested); nothing is pushed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
