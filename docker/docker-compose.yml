name: jangka

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: jangka
      POSTGRES_PASSWORD: jangka
      POSTGRES_DB: jangka
    volumes:
      # PG18 stores data in /var/lib/postgresql/18/docker; mounting .../data would not persist.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jangka -d jangka"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: iqbalr3000/jangka:${JANGKA_VERSION:-latest}
    # The setup wizard tells admins to run `docker logs jangka`.
    container_name: jangka
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://jangka:jangka@postgres:5432/jangka
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY (openssl rand -base64 32)}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    ports:
      - "3000:3000"

volumes:
  pgdata:
